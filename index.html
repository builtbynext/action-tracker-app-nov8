<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Action Tracker</title>
<style>
  :root {
    --bg: #f4f3f0;
    --card: #ffffff;
    --ink: #2b2a28;
    --muted: #8a8780;
    --line: #e7e4de;
    --accent: #e8702a;
    --accent-soft: #fdf0e7;
    --overdue: #c0392b;
    --overdue-soft: #fbeceb;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  main { max-width: 960px; margin: 0 auto; padding: 48px 20px 80px; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 2.2rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); }
  .who { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 0.95rem; }
  .who strong { color: var(--ink); }
  .badge { background: var(--accent-soft); color: var(--accent); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 999px; }
  button.ghost {
    font: inherit; font-size: 0.95rem; background: #fff; color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; cursor: pointer;
  }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
  }

  /* Login */
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login { width: 100%; max-width: 420px; }
  .login h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  .login p.sub { color: var(--muted); margin: 0 0 24px; }
  .login .field { margin-bottom: 16px; }
  .login button.add { width: 100%; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 32px 0 24px; }
  .stat .num { font-size: 2.6rem; font-weight: 700; line-height: 1.1; }
  .stat .label { color: var(--muted); font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .stat.open .num { color: var(--accent); }
  .stat.overdue.has .num { color: var(--overdue); }
  .stat.overdue.has { background: var(--overdue-soft); border-color: #efc9c5; }

  /* Forms */
  form.action-form { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 12px; align-items: end; }
  form.team-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; margin-top: 16px; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  input[type=text], input[type=password], input[type=date] {
    width: 100%;
    font: inherit;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fbfaf8;
    color: var(--ink);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; background: #fff; }
  input.invalid { border-color: var(--overdue); background: var(--overdue-soft); }
  button.add {
    font: inherit; font-weight: 600;
    background: var(--accent); color: #fff;
    border: 0; border-radius: 10px;
    padding: 12px 22px; cursor: pointer;
  }
  button.add:hover { filter: brightness(0.93); }
  button.add:disabled { opacity: 0.6; cursor: wait; }
  .msg { grid-column: 1 / -1; color: var(--overdue); font-size: 0.95rem; min-height: 1.4em; margin: 0; }
  .msg.ok { color: #4a7c59; }

  /* Team panel */
  .team h2 { font-size: 1.2rem; margin: 0 0 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: #f4f3f0; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: 0.95rem; }
  .team .note { color: var(--muted); font-size: 0.9rem; margin: 12px 0 0; }
  details.team summary { cursor: pointer; font-weight: 600; font-size: 1.1rem; }

  /* Groups */
  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 20px; margin-top: 28px; }
  .group h2 { display: flex; justify-content: space-between; align-items: baseline; font-size: 1.35rem; margin: 0 0 14px; }
  .group h2 small { color: var(--muted); font-size: 0.9rem; font-weight: 400; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.item {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 14px 12px; border-top: 1px solid var(--line);
    border-radius: 10px;
  }
  li.item:first-child { border-top: 0; }
  li.item input[type=checkbox] {
    appearance: none; -webkit-appearance: none;
    width: 26px; height: 26px; flex: none; margin-top: 2px;
    border: 2px solid #c9c5bc; border-radius: 8px;
    background: #fff; cursor: pointer; position: relative;
  }
  li.item input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
  li.item input[type=checkbox]:checked::after {
    content: ""; position: absolute; left: 7px; top: 2px; width: 6px; height: 12px;
    border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg);
  }
  li.item input[type=checkbox]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .body { flex: 1; min-width: 0; }
  .text { word-wrap: break-word; }
  .due { font-size: 0.9rem; color: var(--muted); margin-top: 2px; }
  li.item.done .text { text-decoration: line-through; color: var(--muted); }
  li.item.overdue { background: var(--overdue-soft); }
  li.item.overdue .text { color: var(--overdue); font-weight: 600; }
  li.item.overdue .due { color: var(--overdue); font-weight: 600; }
  button.del {
    background: none; border: 0; color: var(--muted); font-size: 1.4rem; line-height: 1;
    cursor: pointer; padding: 2px 6px; border-radius: 6px; opacity: 0.5;
  }
  button.del:hover { opacity: 1; color: var(--overdue); }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
  .toolbar { display: flex; justify-content: flex-end; margin-top: 28px; }
  button.link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 0.9rem; cursor: pointer; text-decoration: underline; }
  button.link:hover { color: var(--accent); }
  .spacer { margin-top: 20px; }

  @media (max-width: 760px) {
    form.action-form, form.team-form { grid-template-columns: 1fr; }
    .groups { grid-template-columns: 1fr; }
    .stats { gap: 10px; }
    .stat .num { font-size: 2rem; }
    .card { padding: 18px; }
  }
</style>
</head>
<body>

<!-- Sign-in screen -->
<div class="login-wrap" id="loginView" hidden>
  <form class="card login" id="loginForm" novalidate>
    <h1>Action Tracker</h1>
    <p class="sub">Sign in to see your team's actions.</p>
    <div class="field">
      <label for="loginUser">Username</label>
      <input type="text" id="loginUser" autocomplete="username" autocapitalize="none" spellcheck="false">
    </div>
    <div class="field">
      <label for="loginPass">Password</label>
      <input type="password" id="loginPass" autocomplete="current-password">
    </div>
    <button class="add" type="submit" id="loginBtn">Sign in</button>
    <p class="msg" id="loginMsg" role="alert"></p>
  </form>
</div>

<!-- Main app -->
<main id="appView" hidden>
  <div class="topbar">
    <header>
      <h1>Action Tracker</h1>
      <p>Agree it. Own it. Close it. <span id="today"></span></p>
    </header>
    <div class="who">
      <span>Signed in as <strong id="meName"></strong></span>
      <span class="badge" id="adminBadge" hidden>Admin</span>
      <button class="ghost" id="signOut" type="button">Sign out</button>
    </div>
  </div>

  <section class="stats" aria-label="Summary">
    <div class="card stat open"><div class="num" id="nOpen">0</div><div class="label">Open</div></div>
    <div class="card stat done"><div class="num" id="nDone">0</div><div class="label">Done</div></div>
    <div class="card stat overdue" id="overdueCard"><div class="num" id="nOver">0</div><div class="label">Overdue</div></div>
  </section>

  <section class="card">
    <form class="action-form" id="form" novalidate>
      <div>
        <label for="text">Action</label>
        <input type="text" id="text" placeholder="e.g. Send revised rota to stores" autocomplete="off">
      </div>
      <div>
        <label for="owner">Owner</label>
        <input type="text" id="owner" list="owners" placeholder="Name" autocomplete="off">
        <datalist id="owners"></datalist>
      </div>
      <div>
        <label for="due">Due date</label>
        <input type="date" id="due">
      </div>
      <button class="add" type="submit">Add action</button>
      <p class="msg" id="hint" role="alert"></p>
    </form>
  </section>

  <section class="groups" id="groups"></section>
  <div class="toolbar"><button class="link" id="clearDone" type="button">Clear completed actions</button></div>

  <!-- Admin only -->
  <details class="card team spacer" id="teamPanel" hidden>
    <summary>Team members</summary>
    <div class="chips spacer" id="teamList"></div>
    <form class="team-form" id="teamForm" novalidate autocomplete="off">
      <div>
        <label for="newUser">New username</label>
        <input type="text" id="newUser" placeholder="e.g. sam" autocapitalize="none" spellcheck="false" autocomplete="off">
      </div>
      <div>
        <label for="newPass">Initial password</label>
        <input type="text" id="newPass" placeholder="At least 8 characters" autocomplete="off">
      </div>
      <button class="add" type="submit" id="teamBtn">Add user</button>
      <p class="msg" id="teamMsg" role="alert"></p>
    </form>
    <p class="note">Usernames use lowercase letters, numbers or underscores. Share the initial password with the person directly.</p>
  </details>
</main>

<script>
(function () {
  // Supabase connection (the publishable key is safe to expose; access is governed by sign-in and row-level security)
  var SUPABASE_URL = "https://ypzeqtlhuulhtftnphqi.supabase.co";
  var SUPABASE_KEY = "sb_publishable_f5kvqPYsxPoPRqjCwshPpA_MoH5tmvH";
  var REST = SUPABASE_URL + "/rest/v1";
  var AUTH = SUPABASE_URL + "/auth/v1";
  var EMAIL_DOMAIN = "@tracker.example.com";
  var SESSION_KEY = "action-tracker-session-v1";

  var session = readSession();
  var actions = [];
  var team = [];
  var isAdmin = false;
  var pollTimer = null;

  function $(id) { return document.getElementById(id); }
  function readSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (e) { return null; }
  }
  function writeSession(s) {
    session = s;
    try { if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); } catch (e) { /* storage unavailable */ }
  }

  /* ---------- Auth ---------- */
  function parse(r) {
    return r.text().then(function (t) {
      var data = null;
      try { data = t ? JSON.parse(t) : null; } catch (e) { data = null; }
      if (!r.ok) {
        var err = new Error((data && (data.message || data.msg || data.error_description)) || ("Request failed (" + r.status + ")"));
        err.status = r.status;
        throw err;
      }
      return data;
    });
  }
  function tokenRequest(grant, body) {
    return fetch(AUTH + "/token?grant_type=" + grant, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(parse).then(function (d) {
      var email = (d.user && d.user.email) || "";
      writeSession({
        access_token: d.access_token,
        refresh_token: d.refresh_token,
        expires_at: d.expires_at || (Math.floor(Date.now() / 1000) + (d.expires_in || 3600)),
        user_id: d.user && d.user.id,
        username: email.split("@")[0]
      });
    });
  }
  function refreshSession() {
    if (!session || !session.refresh_token) return Promise.reject(new Error("No session"));
    return tokenRequest("refresh_token", { refresh_token: session.refresh_token });
  }
  function ensureFresh() {
    if (!session) return Promise.reject(new Error("Not signed in"));
    if (session.expires_at * 1000 - Date.now() < 60000) return refreshSession();
    return Promise.resolve();
  }
  // Authenticated fetch with one refresh-and-retry on 401
  function call(url, method, body, extra) {
    function go() {
      return fetch(url, {
        method: method,
        headers: Object.assign({
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + session.access_token,
          "Content-Type": "application/json"
        }, extra || {}),
        body: body ? JSON.stringify(body) : undefined
      });
    }
    return ensureFresh().then(go).then(function (r) {
      if (r.status !== 401) return r;
      return refreshSession().then(go);
    }).catch(function (err) {
      if (err.status === 400 || err.status === 401 || err.message === "No session" || err.message === "Not signed in") {
        endSession("Your session has ended. Please sign in again.");
      }
      throw err;
    });
  }
  function api(method, query, body) {
    return call(REST + "/actions" + (query || ""), method, body, { Prefer: "return=representation" }).then(parse);
  }

  function signIn(username, password) {
    return tokenRequest("password", { email: username.trim().toLowerCase() + EMAIL_DOMAIN, password: password });
  }
  function endSession(message) {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    writeSession(null);
    actions = []; team = []; isAdmin = false;
    showLogin(message);
  }
  function signOut() {
    var token = session && session.access_token;
    if (token) {
      fetch(AUTH + "/logout", { method: "POST", headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + token } }).catch(function () {});
    }
    endSession("");
  }

  /* ---------- Views ---------- */
  function showLogin(message) {
    $("appView").hidden = true;
    $("loginView").hidden = false;
    $("loginMsg").textContent = message || "";
    $("loginPass").value = "";
    $("loginBtn").disabled = false;
    $("loginUser").focus();
  }
  function showApp() {
    $("loginView").hidden = true;
    $("appView").hidden = false;
    $("meName").textContent = session.username;
    render();
    loadTeam();
    refresh();
    if (!pollTimer) pollTimer = setInterval(refresh, 30000);
  }

  /* ---------- Data ---------- */
  function setStatus(msg) { $("hint").textContent = msg || ""; }
  function fail(err) {
    setStatus("Could not sync with the database: " + err.message);
    refresh();
  }
  function refresh() {
    if (!session) return Promise.resolve();
    return api("GET", "?select=id,text,owner,due,done&order=due.asc").then(function (rows) {
      actions = rows; render();
    }).catch(function (err) {
      if (session) setStatus("Could not load actions: " + err.message);
    });
  }
  function loadTeam() {
    return call(REST + "/profiles?select=id,username,is_admin&order=username.asc", "GET").then(parse).then(function (rows) {
      team = rows;
      var me = rows.filter(function (p) { return p.id === session.user_id; })[0];
      isAdmin = !!(me && me.is_admin);
      $("adminBadge").hidden = !isAdmin;
      $("teamPanel").hidden = !isAdmin;
      renderTeam();
      render();
    }).catch(function () { /* non-fatal */ });
  }

  /* ---------- Helpers ---------- */
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function fmt(iso) {
    var p = iso.split("-");
    return parseInt(p[2], 10) + " " + MONTHS[parseInt(p[1], 10) - 1] + " " + p[0];
  }
  function daysBetween(fromISO, toISO) {
    var a = new Date(fromISO + "T00:00:00"), b = new Date(toISO + "T00:00:00");
    return Math.round((b - a) / 86400000);
  }
  function isOverdue(a) { return !a.done && a.due < todayISO(); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function dueLabel(a) {
    var diff = daysBetween(todayISO(), a.due);
    if (a.done) return "Due " + fmt(a.due);
    if (diff < 0) return "Overdue by " + (-diff) + (diff === -1 ? " day" : " days") + " · " + fmt(a.due);
    if (diff === 0) return "Due today · " + fmt(a.due);
    if (diff === 1) return "Due tomorrow · " + fmt(a.due);
    return "Due " + fmt(a.due);
  }

  /* ---------- Rendering ---------- */
  function renderTeam() {
    var list = $("teamList");
    list.textContent = "";
    team.forEach(function (p) {
      list.appendChild(el("span", "chip", p.username + (p.is_admin ? " (admin)" : "")));
    });
  }

  function render() {
    var open = 0, done = 0, over = 0;
    actions.forEach(function (a) {
      if (a.done) done++; else open++;
      if (isOverdue(a)) over++;
    });
    $("nOpen").textContent = open;
    $("nDone").textContent = done;
    $("nOver").textContent = over;
    $("overdueCard").classList.toggle("has", over > 0);
    $("today").textContent = "Today is " + fmt(todayISO()) + ".";

    var owners = {};
    actions.forEach(function (a) { owners[a.owner] = true; });
    var suggestions = Object.assign({}, owners);
    team.forEach(function (p) { suggestions[p.username] = true; });
    var dl = $("owners");
    dl.textContent = "";
    Object.keys(suggestions).sort().forEach(function (o) {
      var opt = document.createElement("option"); opt.value = o; dl.appendChild(opt);
    });

    var root = $("groups");
    root.textContent = "";
    var names = Object.keys(owners).sort(function (a, b) { return a.localeCompare(b, "en-GB"); });
    if (!names.length) {
      var empty = el("div", "card empty", "No actions yet. Add the first one above so nothing gets forgotten.");
      empty.style.gridColumn = "1 / -1";
      root.appendChild(empty);
      return;
    }
    names.forEach(function (name) {
      var mine = actions.filter(function (a) { return a.owner === name; });
      mine.sort(function (a, b) {
        if (a.done !== b.done) return a.done ? 1 : -1;
        return a.due.localeCompare(b.due);
      });
      var openCount = mine.filter(function (a) { return !a.done; }).length;
      var card = el("div", "card group");
      var h = el("h2", null, name);
      h.appendChild(el("small", null, openCount + " open · " + (mine.length - openCount) + " done"));
      card.appendChild(h);
      var ul = el("ul");
      mine.forEach(function (a) {
        var li = el("li", "item" + (a.done ? " done" : "") + (isOverdue(a) ? " overdue" : ""));
        var cb = document.createElement("input");
        cb.type = "checkbox"; cb.checked = a.done;
        cb.setAttribute("aria-label", "Mark done: " + a.text);
        cb.addEventListener("change", function () {
          a.done = cb.checked; render();
          api("PATCH", "?id=eq." + a.id, { done: a.done }).catch(fail);
        });
        var body = el("div", "body");
        body.appendChild(el("div", "text", a.text));
        body.appendChild(el("div", "due", dueLabel(a)));
        var del = el("button", "del", "×");
        del.type = "button"; del.title = "Delete action"; del.setAttribute("aria-label", "Delete: " + a.text);
        del.addEventListener("click", function () {
          actions = actions.filter(function (x) { return x.id !== a.id; });
          render();
          api("DELETE", "?id=eq." + a.id).catch(fail);
        });
        li.appendChild(cb); li.appendChild(body); li.appendChild(del);
        ul.appendChild(li);
      });
      card.appendChild(ul);
      root.appendChild(card);
    });
  }

  /* ---------- Events ---------- */
  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var u = $("loginUser"), p = $("loginPass");
    var missing = [];
    if (!u.value.trim()) missing.push("username");
    if (!p.value) missing.push("password");
    u.classList.toggle("invalid", !u.value.trim());
    p.classList.toggle("invalid", !p.value);
    if (missing.length) { $("loginMsg").textContent = "Missing: " + missing.join(" and ") + "."; return; }
    $("loginMsg").textContent = "";
    $("loginBtn").disabled = true;
    signIn(u.value, p.value).then(function () {
      p.value = "";
      showApp();
    }).catch(function (err) {
      $("loginBtn").disabled = false;
      $("loginMsg").textContent = (err.status === 400 || err.status === 401)
        ? "Incorrect username or password."
        : "Could not sign in: " + err.message;
    });
  });

  $("signOut").addEventListener("click", signOut);

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var t = $("text"), o = $("owner"), d = $("due");
    var missing = [];
    [[t, "action"], [o, "owner"], [d, "due date"]].forEach(function (pair) {
      var bad = !pair[0].value.trim();
      pair[0].classList.toggle("invalid", bad);
      if (bad) missing.push(pair[1]);
    });
    if (missing.length) { setStatus("Missing: " + missing.join(", ") + ". Every action needs all three."); return; }
    setStatus("");
    var row = { text: t.value.trim(), owner: o.value.trim(), due: d.value, done: false };
    api("POST", "", row).then(function (created) {
      actions.push(created[0]); render();
    }).catch(fail);
    t.value = "";
    t.focus();
  });

  $("clearDone").addEventListener("click", function () {
    var n = actions.filter(function (a) { return a.done; }).length;
    if (!n) return;
    if (confirm("Remove " + n + " completed " + (n === 1 ? "action" : "actions") + "?")) {
      actions = actions.filter(function (a) { return !a.done; });
      render();
      api("DELETE", "?done=eq.true").catch(fail);
    }
  });

  $("teamForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var u = $("newUser"), p = $("newPass"), msg = $("teamMsg");
    var missing = [];
    if (!u.value.trim()) missing.push("username");
    if (!p.value) missing.push("initial password");
    u.classList.toggle("invalid", !u.value.trim());
    p.classList.toggle("invalid", !p.value);
    msg.className = "msg";
    if (missing.length) { msg.textContent = "Missing: " + missing.join(" and ") + "."; return; }
    msg.textContent = "";
    $("teamBtn").disabled = true;
    var name = u.value.trim().toLowerCase();
    call(REST + "/rpc/admin_create_user", "POST", { p_username: name, p_password: p.value }).then(parse).then(function () {
      u.value = ""; p.value = "";
      msg.className = "msg ok";
      msg.textContent = "Added " + name + ". They can sign in now.";
      return loadTeam();
    }).catch(function (err) {
      msg.textContent = err.message;
    }).then(function () { $("teamBtn").disabled = false; });
  });

  document.addEventListener("visibilitychange", function () { if (!document.hidden && session) refresh(); });

  // Default due date: one week from today
  (function () {
    var d = new Date(); d.setDate(d.getDate() + 7);
    $("due").value = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  })();

  /* ---------- Start ---------- */
  if (session) showApp(); else showLogin("");
})();
</script>
</body>
</html>
